<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estudaí - Ocorreu um problema</title>
    <!-- Bootstrap para um visual limpo e responsivo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5 text-center">
    <div class="card shadow mx-auto" style="max-width: 500px;">
        <div class="card-body py-5">
            <h1 class="display-4 text-danger mb-4">Aviso!</h1>
            <p class="lead text-secondary" th:text="${message}">Mensagem de erro explicativa.</p>
            <a href="/disciplinas" class="btn btn-primary btn-lg mt-4">Voltar ao Início</a>
        </div>
    </div>
</div>
</body>
</html>
