<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estudaí - Ocorreu um problema</title>
    <!-- Bootstrap para um visual limpo e responsivo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/ritmo.css}">
</head>
<body class="bg-light">
<div class="container py-5 text-center">
    <div class="card shadow mx-auto erro-cartao">
        <div class="card-body py-5">
            <h1 class="display-4 text-danger mb-4">Aviso!</h1>
            <p class="lead text-secondary" th:text="${message}">Mensagem de erro explicativa.</p>
            <a href="/dashboard" class="btn btn-primary btn-lg mt-4">Voltar ao Início</a>
        </div>
    </div>
</div>
<script th:src="@{/js/ritmo.js}"></script>

</html>
