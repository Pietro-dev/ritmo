<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta | Ritmo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-body-tertiary">
<div class="container-fluid p-0">
    <div class="row g-0 min-vh-100">

        <aside class="col-lg-5 bg-primary text-white d-flex flex-column justify-content-between gap-4 p-4 p-lg-5">
            <a class="link-light link-underline-opacity-0 fs-2 fw-bold" th:href="@{/login}">ritmo</a>

            <div>
                <p class="display-6 fw-bold mb-4 d-none d-lg-block">Crie sua conta e comece pelo primeiro bloco.</p>

                <div class="d-flex flex-column gap-1" aria-hidden="true">
                    <div class="d-flex gap-1">
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-warning"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-warning"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-warning"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-warning"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-warning"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-warning"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                    </div>
                    <div class="d-flex gap-1">
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-info"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-info"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-info"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-info"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                    </div>
                    <div class="d-flex gap-1">
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-success"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-white bg-opacity-25"></div>
                        <div class="flex-fill rounded-1 py-1 py-lg-3 bg-success"></div>
                    </div>
                </div>

                <div class="d-none d-lg-block">
                    <div class="d-flex gap-2 mt-3">
                        <span class="badge text-bg-warning">Estudar</span>
                        <span class="badge text-bg-info">Recordar</span>
                        <span class="badge text-bg-success">Refletir</span>
                    </div>
                    <p class="mt-3 mb-0 text-white">Um ciclo curto de cada vez: estudar, recordar sem consultar e refletir sobre o que funcionou.</p>
                </div>
            </div>
        </aside>

        <main class="col-lg-7 d-flex align-items-center justify-content-center p-4">
            <div class="row w-100 justify-content-center">
                <div class="col-12 col-md-8 col-lg-10 col-xl-8">
                    <h1 class="fw-bold mb-1">Criar conta</h1>
                    <p class="text-secondary mb-4">Preencha os dados abaixo para começar.</p>

                    <form th:action="@{/cadastro}" th:object="${usuarioInputDTO}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="nome">Nome completo</label>
                            <input type="text" th:field="*{nome}" class="form-control form-control-lg" th:errorclass="is-invalid" autocomplete="name">
                            <div class="invalid-feedback" th:errors="*{nome}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="email">E-mail</label>
                            <input type="email" th:field="*{email}" class="form-control form-control-lg" th:errorclass="is-invalid" autocomplete="email">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold" for="senha">Senha</label>
                            <div class="input-group input-group-lg has-validation">
                                <input type="password" th:field="*{senha}" class="form-control" th:errorclass="is-invalid" autocomplete="new-password">
                                <button type="button" class="btn btn-outline-secondary" data-alternar-senha aria-controls="senha">Mostrar</button>
                                <div class="invalid-feedback" th:errors="*{senha}"></div>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input type="checkbox" th:field="*{aceitouTermo}" class="form-check-input" id="checkTermo" th:errorclass="is-invalid">
                            <label class="form-check-label text-secondary" for="checkTermo">
                                Li e concordo com os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a> (LGPD).
                            </label>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('aceitouTermo')}" th:errors="*{aceitouTermo}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100">Criar conta</button>
                    </form>

                    <p class="text-secondary mt-4 mb-0">Já possui conta? <a class="fw-semibold" th:href="@{/login}">Entrar</a></p>
                </div>
            </div>
        </main>

    </div>
</div>

<script>
    // Alterna entre mostrar e ocultar a senha
    document.querySelectorAll('[data-alternar-senha]').forEach(function (botao) {
        var campo = document.getElementById(botao.getAttribute('aria-controls'));
        botao.addEventListener('click', function () {
            var mostrar = campo.type === 'password';
            campo.type = mostrar ? 'text' : 'password';
            botao.textContent = mostrar ? 'Ocultar' : 'Mostrar';
        });
    });
</script>
</body>
</html>
