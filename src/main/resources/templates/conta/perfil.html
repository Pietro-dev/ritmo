<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<section layout:fragment="content">
    <header class="mb-4">
        <h1 class="fw-bold mb-1">Minha conta</h1>
        <p class="text-secondary mb-0">Atualize seus dados de acesso ou exclua sua conta.</p>
    </header>

    <div th:if="${param.atualizada}" class="alert alert-success" role="status">
        Perfil atualizado.
    </div>

    <section class="card border-0 shadow-sm rounded-4 mb-4" aria-labelledby="tituloPerfil">
        <div class="card-body p-4">
            <h2 class="h4 fw-bold mb-3" id="tituloPerfil">Dados do perfil</h2>
            <div th:if="${erroPerfil}" class="alert alert-danger" role="alert" th:text="${erroPerfil}"></div>
            <form th:action="@{/conta/perfil}" th:object="${perfilInput}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="nome">Nome</label>
                    <input class="form-control" id="nome" type="text" th:field="*{nome}" maxlength="150" required>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nome')}"
                         th:errors="*{nome}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="senhaAtualPerfil">Senha atual <span class="text-secondary">(necessária para trocar a senha)</span></label>
                    <input class="form-control" id="senhaAtualPerfil" type="password"
                           th:field="*{senhaAtual}" autocomplete="current-password">
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="novaSenha">Nova senha</label>
                        <input class="form-control" id="novaSenha" type="password"
                               th:field="*{novaSenha}" autocomplete="new-password">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="confirmarNovaSenha">Confirme a nova senha</label>
                        <input class="form-control" id="confirmarNovaSenha" type="password"
                               th:field="*{confirmarNovaSenha}" autocomplete="new-password">
                    </div>
                </div>
                <button class="btn btn-primary rounded-pill mt-4" type="submit">Salvar alterações</button>
            </form>
        </div>
    </section>

    <section class="card border border-danger-subtle rounded-4" aria-labelledby="tituloExcluir">
        <div class="card-body p-4">
            <h2 class="h4 fw-bold text-danger mb-2" id="tituloExcluir">Excluir conta</h2>
            <p class="text-secondary">
                A exclusão é permanente e remove seus dados de estudo e registros de auditoria.
                Uma conta administrativa só pode ser excluída se houver outro administrador ativo.
            </p>
            <div th:if="${erroExclusao}" class="alert alert-danger" role="alert" th:text="${erroExclusao}"></div>
            <form th:action="@{/conta/excluir}" th:object="${exclusaoInput}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="senhaAtualExclusao">Confirme sua senha atual</label>
                    <input class="form-control" id="senhaAtualExclusao" type="password"
                           th:field="*{senhaAtual}" autocomplete="current-password" required>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" id="confirmarExclusao" type="checkbox"
                           th:field="*{confirmarExclusao}" required>
                    <label class="form-check-label" for="confirmarExclusao">
                        Entendo que esta ação não pode ser desfeita.
                    </label>
                </div>
                <button class="btn btn-outline-danger rounded-pill" type="submit">Excluir minha conta</button>
            </form>
        </div>
    </section>
</section>
</html>
