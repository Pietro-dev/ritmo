<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<section layout:fragment="content">

    <!-- Cabeçalho -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Disciplinas</h2>
            <p class="text-muted mb-0">Gerencie as disciplinas cadastradas no Estudaí.</p>
        </div>
    </div>

    <!-- Card de resumo -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary bg-opacity-10 rounded p-3 me-3">
                            <i class="bi bi-book fs-3 text-primary"></i>
                        </div>
                        <div>
                            <small class="text-muted">Total de disciplinas</small>
                            <h3 class="mb-0" th:text="${#lists.size(disciplinas)}">0</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Conteúdo -->
    <div class="row g-4">

        <!-- Cadastro -->
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="fw-semibold mb-1">Nova disciplina</h5>
                    <small class="text-muted">Cadastre uma nova disciplina.</small>
                </div>

                <div class="card-body">
                    <form th:action="@{/disciplinas}" th:object="${disciplinaInput}" method="post">
                        <div class="mb-3">
                            <label for="nome" class="form-label fw-semibold">Nome da disciplina</label>
                            <input type="text" id="nome" th:field="*{nome}" class="form-control" placeholder="Ex: Matemática" autocomplete="off">
                            <div class="text-danger small mt-2" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro de validação</div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-plus-lg me-1"></i>
                            Adicionar disciplina
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tabela -->
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
<!--                                <th class="px-4">ID</th>-->
                                <th>Disciplina</th>
                                <th class="text-end px-4">Ações</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="disciplina : ${disciplinas}">
<!--                                <td class="px-4">-->
<!--                                    <span class="text-muted" th:text="${disciplina.id}">1</span>-->
<!--                                </td>-->

                                <td>
                                    <div class="d-flex align-items-center">
                                        <div class="bg-light rounded p-2 me-3">
                                            <i class="bi bi-book text-primary"></i>
                                        </div>
                                        <div>
                                            <div class="fw-semibold" th:text="${disciplina.nome}">Java</div>
                                            <small class="text-muted">Disciplina</small>
                                        </div>
                                    </div>
                                </td>

                                <td class="text-end px-4">
                                    <div class="btn-group">
                                        <a th:href="@{/disciplinas/{id}/editar(id=${disciplina.id})}" class="btn btn-sm btn-outline-warning" title="Editar">
                                            <i class="bi bi-pencil"></i>
                                        </a>

                                        <form th:action="@{/disciplinas/{id}(id=${disciplina.id})}"
                                              method="post"
                                              class="d-inline"
                                              onsubmit="return confirm('Tem certeza que deseja excluir esta disciplina?');">

                                            <input type="hidden" name="_method" value="delete">

                                            <button type="submit"
                                                    class="btn btn-sm btn-outline-danger"
                                                    title="Excluir">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(disciplinas)}">
                                <td colspan="3" class="text-center text-muted py-5">
                                    <i class="bi bi-book fs-1 d-block mb-3"></i>
                                    <div class="fw-semibold">Nenhuma disciplina cadastrada</div>
                                    <small>Cadastre sua primeira disciplina usando o formulário ao lado.</small>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

</section>
</html>
