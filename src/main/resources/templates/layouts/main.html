
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title layout:title-pattern="$CONTENT_TITLE | Ritmo">Ritmo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="icon"
          th:href="@{/images/icons8-book-32.png}"
          type="image/png">
</head>

<body class="bg-body-tertiary d-flex flex-column min-vh-100">

<!-- Menu de navegação -->
<nav class="navbar navbar-expand-md bg-dark" data-bs-theme="dark">
    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold fs-3"
           th:href="@{/dashboard}">
            ritmo
        </a>

        <!-- Botão do menu mobile -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menu">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">

            <!-- Links principais -->
            <ul class="nav nav-pills me-auto gap-1 mt-2 mt-md-0">

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/dashboard}"
                       th:classappend="${paginaAtiva == 'dashboard'} ? ' active' : ' text-white'">
                        Início
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/disciplinas}"
                       th:classappend="${paginaAtiva == 'disciplinas'} ? ' active' : ' text-white'">
                        Disciplinas
                    </a>
                </li>

            </ul>

            <!-- Ações à direita -->
            <div class="d-flex align-items-center gap-2 mt-2 mt-md-0">

                <!-- Acesso administrativo -->
                <a th:if="${ehAdmin}"
                   th:href="@{/admin/auditorias}"
                   class="btn btn-outline-warning rounded-pill">
                    Auditorias
                </a>

                <!-- Menu do usuário -->
                <div class="dropdown" th:if="${usuario != null}">

                    <button class="btn btn-outline-light rounded-pill dropdown-toggle"
                            type="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                            th:text="${usuario.nome}">
                        Usuário
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item">
                                    Sair
                                </button>
                            </form>
                        </li>
                    </ul>

                </div>

            </div>
        </div>
    </div>
</nav>

<!-- Conteúdo das páginas -->
<main class="container py-4 flex-grow-1">
    <section layout:fragment="content">
        Conteúdo da página
    </section>
</main>

<!-- Rodapé original -->
<footer class="border-top bg-white py-4 mt-5">
    <div class="container text-center">
        <small class="text-muted">
            Ritmo • Organize seus estudos
        </small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
