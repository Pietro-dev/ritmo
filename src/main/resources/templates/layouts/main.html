<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title layout:title-pattern="$CONTENT_TITLE | Estudaí">Estudaí</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" th:href="@{/images/icons8-book-32.png}" type="image/png">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">
            <i class="bi bi-book me-1"></i>
            Estudaí
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
                aria-controls="navbarContent"
                aria-expanded="false"
                aria-label="Alternar navegação">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">
                        <i class="bi bi-house me-1"></i>
                        Início
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/disciplinas}">
                        <i class="bi bi-book me-1"></i>
                        Disciplinas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/admin/auditorias}">
                        <i class="bi bi-shield-check me-1"></i>
                        Auditorias
                    </a>
                </li>

            </ul>
        </div>

    </div>
</nav>

<main class="container py-4 flex-grow-1">
    <section layout:fragment="content">
        Conteúdo da página
    </section>
</main>

<footer class="border-top bg-white py-4 mt-5">
    <div class="container text-center">
        <small class="text-muted">
            Estudaí • Organize seus estudos
        </small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
